:12px}.field{margin-bottom:12px}.field label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #ded8e6;border-radius:11px;padding:10px;background:#fff}.field textarea{min-height:75px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.palette-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.palette{border:2px solid transparent;border-radius:14px;background:#fafafa;padding:9px;cursor:pointer;text-align:right}.palette:hover,.palette.selected{border-color:var(--purple);background:#fbf9ff}.palette b{font-size:11px}.dots{display:flex;gap:4px;margin-top:7px}.dots i{width:19px;height:19px;border-radius:50%;border:1px solid #0001}.color-row{display:grid;grid-template-columns:42px 1fr;gap:8px;margin-bottom:8px;align-items:center}.color-row input[type=color]{width:42px;height:38px;padding:2px;border-radius:9px}.color-row input[type=text]{width:100%;border:1px solid #ded8e6;border-radius:9px;padding:9px}.switchrow{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:11px;border-radius:12px;margin-bottom:8px}.switchrow strong{font-size:12px}.switchrow small{display:block;color:#93899c;font-size:10px;margin-top:3px}.switch{width:43px;height:25px;position:relative}.switch input{display:none}.switch span{position:absolute;inset:0;background:#d9d3df;border-radius:30px;cursor:pointer}.switch span:after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;right:3px;top:3px;transition:.2s;box-shadow:0 1px 4px #999}.switch input:checked+span{background:#22c55e}.switch input:checked+span:after{transform:translateX(-18px)}.section-card{border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}.section-top{display:flex;gap:8px;align-items:center;padding:10px}.section-top .grab{color:#aaa}.section-top div:nth-child(2){flex:1}.section-top strong{font-size:12px}.section-top small{display:block;color:#948a9d;font-size:10px}.orderbtns button,.mini{border:0;background:#f3eff7;border-radius:8px;padding:6px 8px;cursor:pointer}.quick{padding:10px;border-top:1px solid var(--line);background:#fcfbfd}.advanced-toggle{width:100%;border:1px dashed #bcaed0;background:#faf7ff;color:#6d28d9;padding:10px;border-radius:11px;cursor:pointer}.bottom{border-top:1px solid var(--line);padding:10px;display:flex;gap:7px}.bottom button{flex:1}.preview{background:#211d24;padding:9px;display:flex;flex-direction:column}.previewbar{height:38px;color:#fff;display:flex;align-items:center;justify-content:space-between}.devices button{border:0;border-radius:8px;padding:6px 9px;cursor:pointer}.devices button.active{background:#8b5cf6;color:#fff}.frame{flex:1;min-height:0;display:flex;justify-content:center}.frame iframe{width:100%;height:100%;border:0;border-radius:11px;background:#fff;transition:.2s}.toastx{position:fixed;bottom:20px;left:20px;padding:11px 16px;border-radius:11px;background:#242028;color:#fff;z-index:99}.mobile-preview{display:none}.seg{display:flex;background:#f3eff7;padding:3px;border-radius:11px}.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer}.seg button.active{background:#fff;box-shadow:0 1px 5px #0001}.checklist label{display:flex;gap:8px;font-size:11px;padding:6px 0}.welcome-big{padding:18px;border-radius:16px;background:linear-gradient(135deg,#6d28d9,#9f67ed);color:#fff;margin-bottom:12px}.welcome-big h2{font-size:20px;margin:0 0 7px}.welcome-big p{font-size:11px;line-height:1.8;color:#eee3ff}.action-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-card{padding:13px;border:1px solid var(--line);border-radius:13px;cursor:pointer}.action-card b{font-size:12px;display:block}.action-card small{font-size:10px;color:#8d8396}.saved{color:#16a34a;font-size:11px}.price-preview{background:#fafafa;border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.price-preview-box{background:var(--pbg);border-radius:var(--pr);padding:var(--pp);display:flex;flex-direction:column}.price-preview-box del{color:var(--po);font-size:var(--pofs)}.price-preview-main{display:flex;justify-content:space-between;align-items:center;gap:8px}.price-preview-main strong{color:var(--ps);font-size:var(--psfs)}.price-preview-main b{background:var(--pd);color:var(--pdt);font-size:var(--pdfs);border-radius:14px;padding:8px 11px}.price-preview-box small{color:var(--pg);margin-top:5px}.control-note{font-size:10px;color:#8d8396;margin:-6px 0 10px;line-height:1.7}.range-value{color:var(--purple);font-weight:800}

</style></head><body><div class="main-area"><nav class="navbar"><div class="navbar-brand"><span class="brand-icon">✦</span><span class="brand-text">استودیو ساخت فروشگاه</span></div><div class="navbar-actions"><span class="saved" id="saveState">ذخیره خودکار روشن است</span><a href="storefront.html" target="_blank" class="btn-nav">دیدن فروشگاه ↗</a><a href="index.html" class="btn-nav">پنل اصلی</a></div></nav><main class="content"><div class="studio">
<aside class="box rail" id="rail"></aside><aside class="box navpanel"><h2 id="navTitle">خانه‌ی طراحی</h2><p id="navDesc">بدون دانش فنی، ظاهر فروشگاه را مدیریت کنید.</p><div class="health"><strong>آمادگی فروشگاه: ۸۲٪</strong><div class="meter"><i></i></div></div><div id="navList"></div></aside>
<section class="box editor"><div class="editor-head"><h2 id="editorTitle"></h2><p id="editorDesc"></p></div><div class="editor-body" id="editorBody"></div><div class="bottom"><button class="btn btn-secondary" onclick="undo()">↶ بازگشت</button><button class="btn btn-primary" onclick="saveNow()">ذخیره</button><button class="btn btn-secondary mobile-preview" onclick="previewPanel.classList.add('show')">پیش‌نمایش</button></div></section>
<section class="box preview" id="previewPanel"><div class="previewbar"><strong>پیش‌نمایش زنده</strong><div class="devices"><button class="active" onclick="device(this,'100%')">رایانه</button><button onclick="device(this,'768px')">تبلت</button><button onclick="device(this,'390px')">موبایل</button><button class="mobile-preview" onclick="previewPanel.classList.remove('show')">بستن</button></div></div><div class="frame"><iframe id="preview" src="storefront.html"></iframe></div></section>
</div></main></div><script src="assets/store-config.js"></script><script>
let config=StoreConfig.get(), history=[], activeArea='home', activeItem='overview', advanced=false, timer;const clone=o=>JSON.parse(JSON.stringify(o));
const palettes=[
['رز لطیف','#b83280','#f4b5c9','#281823','#fffafd','#ffffff'],['طلای لوکس','#9a6b22','#e7c98e','#241d13','#fffdf7','#ffffff'],['سبز طبیعی','#2f7654','#b8d8c5','#183127','#f7fcf9','#ffffff'],['آبی آرام','#2563a8','#a9cbea','#172b42','#f7fbff','#ffffff'],['بنفش مدرن','#6d28d9','#c4b5fd','#25133f','#fbf9ff','#ffffff'],['نارنجی گرم','#c95e19','#ffc38f','#3d2417','#fffaf5','#ffffff'],['مینیمال مشکی','#18181b','#d4d4d8','#111113','#fafafa','#ffffff'],['مرجانی شاد','#dc4b64','#ffc2cb','#3d1d24','#fff8f9','#ffffff']];
const areas=[['home','⌂','شروع'],['design','◉','ظاهر'],['sections','▤','صفحه'],['content','✎','محتوا'],['mobile','▣','موبایل'],['settings','⚙','تنظیمات']];
const menu={home:[['overview','شروع سریع','کارهای مهم فروشگاه'],['checklist','چک‌لیست انتشار','مراحل آماده‌شدن']],design:[['palettes','پالت‌های آماده','۸ ترکیب حرفه‌ای'],['colors','رنگ‌های دلخواه','تغییر تک‌تک رنگ‌ها'],['shape','فونت و فرم','اندازه و گوشه‌ها']],sections:[['layout','چیدمان صفحه','ترتیب و نمایش بخش‌ها'],['header','سربرگ و منو','لوگو، جستجو و پیام'],['footer','پایین سایت','تماس و توضیحات']],content:[['hero','بنر اصلی','عنوان، عکس و دکمه‌ها'],['categories','دسته‌بندی‌ها','مسیر دسترسی مشتری'],['products','محصولات','نمایش و قیمت'],['promo','اعتماد و مشاوره','مزیت و راهنمای خرید'],['newsletter','خبرنامه','عضویت مشتری']],mobile:[['responsive','نمایش موبایل','پیش‌نمایش و اندازه‌ها']],settings:[['backup','ذخیره و بازنشانی','نسخه پشتیبان']]} ;
const sectionMeta={hero:['بنر اصلی','اولین پیام فروشگاه'],categories:['دسته‌بندی‌ها','دسترسی سریع مشتری'],products:['محصولات ویژه','کالاهای منتخب'],promo:['مشاوره خرید','کمک به انتخاب'],benefits:['مزیت‌های خرید','اعتمادسازی'],newsletter:['خبرنامه','جمع‌آوری شماره']};
function get(path){return path.split('.').reduce((o,k)=>o?.[k],config)}function set(path,val){let a=path.split('.'),o=config;a.slice(0,-1).forEach(k=>o=o[k]);o[a.at(-1)]=val}
function renderRail(){rail.innerHTML=areas.map(a=>`<button class="${activeArea===a[0]?'active':''}" onclick="openArea('${a[0]}')"><b>${a[1]}</b>${a[2]}</button>`).join('')}
function openArea(a){activeArea=a;activeItem=menu[a][0][0];renderAll()}
function renderNav(){navTitle.textContent=areas.find(x=>x[0]===activeArea)[2];navDesc.textContent=activeArea==='design'?'ظاهر کلی برند را بدون خراب‌کردن چیدمان تغییر دهید.':'یک بخش را برای ویرایش انتخاب کنید.';navList.innerHTML=menu[activeArea].map(x=>`<button class="navitem ${activeItem===x[0]?'active':''}" onclick="openItem('${x[0]}')"><span><b>${x[1]}</b><small>${x[2]}</small></span>‹</button>`).join('')}
function openItem(i){activeItem=i;renderAll()}
function renderAll(){renderRail();renderNav();const titles=[...Object.values(menu).flat()].find(x=>x[0]===activeItem)||['',''];editorTitle.textContent=titles[1];editorDesc.textContent=titles[2];editorBody.innerHTML=views[activeItem]();bind()}
function field(label,path,type='text'){let v=get(path)??'';return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-path="${path}">${v}</textarea>`:`<input type="${type}" data-path="${path}" value="${v}">`}</div>`}
function toggle(path,title,desc){return `<div class="switchrow"><div><strong>${title}</strong><small>${desc}</small></div><label class="switch"><input type="checkbox" data-path="${path}" ${get(path)!==false?'checked':''}><span></span></label></div>`}
function colors(){let arr=[['رنگ اصلی','brand.primary'],['رنگ مکمل','brand.accent'],['متن و فوتر','brand.dark'],['پس‌زمینه','brand.background'],['کارت‌ها','brand.surface'],['متن اصلی','brand.text'],['متن کم‌رنگ','brand.muted'],['پیام موفق','brand.success']];return arr.map(x=>`<div class="color-row"><input type="color" data-path="${x[1]}" value="${get(x[1])}"><input type="text" data-path="${x[1]}" value="${get(x[1])}" aria-label="${x[0]}"></div>`).join('')}
const views={
overview:()=>`<div class="welcome-big"><h2>فروشگاه شما آماده‌ی زیباتر شدن است</h2><p>برای شروع فقط یک پالت انتخاب کنید، بنر را تغییر دهید و محصولات را وارد کنید. تنظیمات تخصصی اختیاری‌اند.</p></div><div class="action-cards"><div class="action-card" onclick="activeArea='design';activeItem='palettes';renderAll()"><b>🎨 انتخاب ظاهر</b><small>شروع با یکی از ۸ پالت</small></div><div class="action-card" onclick="activeArea='content';activeItem='hero';renderAll()"><b>🖼 تغییر بنر</b><small>پیام اصلی فروشگاه</small></div><div class="action-card" onclick="activeArea='content';activeItem='products';renderAll()"><b>🛍 محصولات</b><small>ویرایش کالاها و قیمت</small></div><div class="action-card" onclick="activeArea='sections';activeItem='layout';renderAll()"><b>▤ ترتیب صفحه</b><small>نمایش، مخفی و جابه‌جایی</small></div></div><div class="group" style="margin-top:12px"><h3>پیشنهاد هوشمند</h3><div class="hint">رنگ اصلی فروشگاه شما گرم است. برای خوانایی بهتر، رنگ دکمه و متن تیره نگه داشته شده است.</div><button class="advanced-toggle" onclick="advanced=!advanced;renderAll()">${advanced?'پنهان‌کردن تنظیمات حرفه‌ای':'نمایش تنظیمات حرفه‌ای'}</button></div>`,
checklist:()=>`<div class="group checklist"><h3>پیش از انتشار</h3><label><input type="checkbox" checked> نام و لوگوی فروشگاه</label><label><input type="checkbox" checked> حداقل یک محصول فعال</label><label><input type="checkbox"> اطلاعات تماس واقعی</label><label><input type="checkbox"> بررسی نسخه موبایل</label><label><input type="checkbox"> اتصال درگاه پرداخت</label></div>`,
palettes:()=>`<div class="hint">انتخاب پالت فقط نقطه شروع است؛ بعد از آن می‌توانید هر رنگ را جداگانه تغییر دهید.</div><div class="palette-grid">${palettes.map((p,i)=>`<button class="palette" onclick="applyPalette(${i})"><b>${p[0]}</b><div class="dots">${p.slice(1).map(c=>`<i style="background:${c}"></i>`).join('')}</div></button>`).join('')}</div>`,
colors:()=>`<div class="hint">هر رنگ را از مربع رنگی یا با واردکردن کد تغییر دهید. نتیجه همان لحظه دیده می‌شود.</div><div class="group"><h3>رنگ‌های برند</h3>${colors()}</div><button class="advanced-toggle" onclick="autoContrast()">تنظیم خودکار خوانایی رنگ‌ها</button>`,
shape:()=>`<div class="group"><h3>حس کلی طراحی</h3>${field('گردی گوشه‌ها','brand.radius','range')}${field('اندازه نوشته‌ها','brand.fontScale','range')}<div class="field"><label>مدل کارت محصول</label><select data-path="brand.cardStyle"><option value="soft">نرم و سایه‌دار</option><option value="border">ساده و خط‌دار</option><option value="flat">کاملاً مینیمال</option></select></div><div class="field"><label>مدل دکمه‌ها</label><select data-path="brand.buttonStyle"><option value="filled">رنگی</option><option value="outline">خطی</option><option value="pill">کپسولی</option></select></div></div>`,
layout:()=>`<div class="hint">هر بخش را روشن یا خاموش کنید و با فلش‌ها ترتیب آن را تغییر دهید. طراحی امن باقی می‌ماند.</div>${config.sectionOrder.map((k,i)=>`<div class="section-card"><div class="section-top"><span class="grab">☷</span><div><strong>${sectionMeta[k][0]}</strong><small>${sectionMeta[k][1]}</small></div><div class="orderbtns"><button onclick="moveSec(${i},-1)">↑</button><button onclick="moveSec(${i},1)">↓</button></div><label class="switch"><input type="checkbox" data-path="sections.${k}" ${config.sections[k]!==false?'checked':''}><span></span></label></div><div class="quick"><button class="mini" onclick="jump('${k}')">ویرایش محتوا</button></div></div>`).join('')}`,
header:()=>`${toggle('sections.announcement','نوار پیام','پیام کوتاه بالای فروشگاه')}${field('متن پیام','announcement')}${toggle('sections.header','سربرگ و منو','نام، جستجو و سبد خرید')}${field('نام فروشگاه','brand.name')}${field('شعار کوتاه','brand.tagline')}${field('حرف یا نشانه لوگو','brand.logo')}`,
footer:()=>`${toggle('sections.footer','نمایش فوتر','اطلاعات پایین همه صفحات')}${field('درباره فروشگاه','footer.about','textarea')}<div class="grid2">${field('تلفن','footer.phone')}${field('ایمیل','footer.email')}</div>${field('نشانی','footer.address','textarea')}`,
hero:()=>`${toggle('sections.hero','نمایش بنر اصلی','اولین بخش صفحه')}${field('عنوان کوچک','hero.eyebrow')}${field('عنوان اصلی','hero.title')}${field('توضیح','hero.text','textarea')}<div class="grid2">${field('متن دکمه اصلی','hero.button')}${field('متن دکمه دوم','hero.secondary')}</div>${field('آدرس تصویر','hero.image','url')}`,
categories:()=>`${toggle('sections.categories','نمایش دسته‌بندی‌ها','مسیر سریع خرید')}<div class="grid2">${field('عنوان بخش','sectionTitles.categoriesTitle')}${field('توضیح کوتاه','sectionTitles.categoriesSubtitle')}</div>`+config.categories.map((c,i)=>`<div class="section-card"><div class="section-top"><div><strong>${c.name}</strong><small>${c.enabled!==false?'نمایش داده می‌شود':'مخفی است'}</small></div><button class="mini" onclick="editCategory(${i})">ویرایش</button><label class="switch"><input type="checkbox" data-array="categories" data-index="${i}" ${c.enabled!==false?'checked':''}><span></span></label></div></div>`).join(''),
products:()=>`${toggle('sections.products','نمایش محصولات','بخش اصلی فروش')}<div class="grid2">${field('عنوان بخش','sectionTitles.productsTitle')}${field('توضیح کوتاه','sectionTitles.productsSubtitle')}</div>
<div class="group"><h3>کامپوننت هوشمند قیمت</h3><div class="hint">این تنظیمات روی همه کارت‌های محصول و همه قالب‌ها اعمال می‌شود. درصد تخفیف روی عکس محصول نمایش داده نمی‌شود و فقط در بخش قیمت قرار می‌گیرد.</div>
${toggle('priceComponent.showOldPrice','نمایش قیمت قبلی','فقط برای محصولات تخفیف‌دار')}
${toggle('priceComponent.showDiscount','نمایش درصد تخفیف','داخل باکس قیمت')}
${toggle('priceComponent.showSaving','نمایش میزان صرفه‌جویی','اختلاف قیمت قبلی و جدید')}
<div class="field"><label>مدل نمایش قیمت</label><select data-path="priceComponent.model"><option value="boxed">باکس برجسته مانند تصویر</option><option value="inline">ساده و بدون پس‌زمینه</option><option value="minimal">مینیمال با خط جداکننده</option><option value="stack">فشرده برای کارت کوچک</option></select></div>
<div class="field"><label>محل درصد تخفیف</label><select data-path="priceComponent.discountPosition"><option value="left">سمت چپ</option><option value="right">سمت راست</option></select></div>
<div class="grid2"><div class="field"><label>رنگ پس‌زمینه</label><input type="color" data-path="priceComponent.background" value="${config.priceComponent.background}"></div><div class="field"><label>رنگ قیمت جدید</label><input type="color" data-path="priceComponent.saleColor" value="${config.priceComponent.saleColor}"></div><div class="field"><label>رنگ قیمت قبلی</label><input type="color" data-path="priceComponent.oldColor" value="${config.priceComponent.oldColor}"></div><div class="field"><label>رنگ درصد تخفیف</label><input type="color" data-path="priceComponent.discountColor" value="${config.priceComponent.discountColor}"></div><div class="field"><label>رنگ نوشته تخفیف</label><input type="color" data-path="priceComponent.discountTextColor" value="${config.priceComponent.discountTextColor}"></div><div class="field"><label>رنگ صرفه‌جویی</label><input type="color" data-path="priceComponent.savingColor" value="${config.priceComponent.savingColor}"></div></div>
<div class="field"><label>گردی باکس <span class="range-value">${config.priceComponent.radius}px</span></label><input type="range" min="0" max="36" data-path="priceComponent.radius" value="${config.priceComponent.radius}"></div>
<div class="field"><label>اندازه قیمت جدید <span class="range-value">${config.priceComponent.saleFontSize}px</span></label><input type="range" min="16" max="34" data-path="priceComponent.saleFontSize" value="${config.priceComponent.saleFontSize}"></div>
<div class="field"><label>اندازه قیمت قبلی <span class="range-value">${config.priceComponent.oldFontSize}px</span></label><input type="range" min="10" max="20" data-path="priceComponent.oldFontSize" value="${config.priceComponent.oldFontSize}"></div>
<div class="field"><label>اندازه درصد تخفیف <span class="range-value">${config.priceComponent.discountFontSize}px</span></label><input type="range" min="11" max="22" data-path="priceComponent.discountFontSize" value="${config.priceComponent.discountFontSize}"></div>
<div class="price-preview"><strong style="font-size:11px">نمونه‌ی سریع</strong><div class="price-preview-box" style="--pbg:${config.priceComponent.background};--pr:${config.priceComponent.radius}px;--pp:${config.priceComponent.padding}px;--ps:${config.priceComponent.saleColor};--po:${config.priceComponent.oldColor};--pd:${config.priceComponent.discountColor};--pdt:${config.priceComponent.discountTextColor};--pg:${config.priceComponent.savingColor};--psfs:${config.priceComponent.saleFontSize}px;--pofs:${config.priceComponent.oldFontSize}px;--pdfs:${config.priceComponent.discountFontSize}px"><del>${(16500000).toLocaleString('fa-IR')} تومان</del><div class="price-preview-main"><strong>${(14520000).toLocaleString('fa-IR')} تومان</strong><b>۱۲٪</b></div>${config.priceComponent.showSaving?'<small>۱,۹۸۰,۰۰۰ تومان صرفه‌جویی</small>':''}</div></div></div>`+config.products.map((x,i)=>`<div class="section-card"><div class="section-top"><div><strong>${x.name}</strong><small>${Number(x.price).toLocaleString('fa-IR')} تومان${x.oldPrice?' — قبلی: '+Number(x.oldPrice).toLocaleString('fa-IR'):''}</small></div><button class="mini" onclick="editProduct(${i})">ویرایش</button><label class="switch"><input type="checkbox" data-array="products" data-index="${i}" ${x.enabled!==false?'checked':''}><span></span></label></div></div>`).join(''),
promo:()=>`${toggle('sections.promo','نمایش مشاوره خرید','راهنمای انتخاب محصول')}${field('عنوان','promo.title')}${field('توضیح','promo.text','textarea')}${field('متن دکمه','promo.button')}${field('آدرس تصویر','promo.image','url')}<div class="group"><h3>مزیت‌های خرید</h3>${toggle('sections.benefits','نمایش مزیت‌ها','ارسال، ضمانت و پشتیبانی')}</div>`,
newsletter:()=>`${toggle('sections.newsletter','نمایش خبرنامه','دریافت شماره مشتری')}${field('عنوان','sectionTitles.newsletterTitle')}${field('توضیح','sectionTitles.newsletterText','textarea')}`,
responsive:()=>`<div class="hint">با دکمه‌های بالای پیش‌نمایش، فروشگاه را در موبایل و تبلت ببینید. چیدمان به‌صورت خودکار سازگار است.</div><div class="group"><h3>اولویت موبایل</h3>${toggle('sections.announcement','نمایش پیام بالا در موبایل','برای کمپین‌ها مفید است')}<div class="field"><label>اندازه نوشته‌ها</label><input type="range" min="90" max="115" data-path="brand.fontScale" value="${config.brand.fontScale||100}"></div></div>`,
backup:()=>`<div class="group"><h3>مدیریت تغییرات</h3><button class="advanced-toggle" onclick="exportData()">دریافت فایل تنظیمات</button><button class="advanced-toggle" style="margin-top:8px" onclick="resetAll()">بازگردانی ظاهر اولیه</button></div>`};
function bind(){document.querySelectorAll('[data-path]').forEach(el=>{if(el.tagName==='SELECT')el.value=get(el.dataset.path);el.addEventListener(el.type==='checkbox'?'change':'input',()=>{push();let v=el.type==='checkbox'?el.checked:el.value;set(el.dataset.path,v);changed()})});document.querySelectorAll('[data-array]').forEach(el=>el.addEventListener('change',()=>{push();config[el.dataset.array][+el.dataset.index].enabled=el.checked;changed()}))}
function push(){history.push(clone(config));if(history.length>20)history.shift()}function changed(){clearTimeout(timer);saveState.textContent='در حال ذخیره…';StoreConfig.set(config);preview.contentWindow.location.reload();timer=setTimeout(()=>saveState.textContent='همه تغییرات ذخیره شده‌اند',500);renderNav()}
function saveNow(){StoreConfig.set(config);preview.contentWindow.location.reload();toast('تغییرات ذخیره شد')}function undo(){if(!history.length)return toast('تغییری برای بازگشت نیست');config=history.pop();StoreConfig.set(config);renderAll();preview.contentWindow.location.reload();toast('آخرین تغییر برگشت')}
function applyPalette(i){push();let p=palettes[i];['primary','accent','dark','background','surface'].forEach((k,j)=>config.brand[k]=p[j+1]);config.brand.text=config.brand.dark;changed();renderAll();toast('پالت اعمال شد؛ همه رنگ‌ها قابل تغییرند')}
function autoContrast(){config.brand.text=config.brand.dark;config.brand.muted='#756b73';changed();renderAll();toast('خوانایی رنگ‌ها تنظیم شد')}
function moveSec(i,d){let j=i+d;if(j<0||j>=config.sectionOrder.length)return;push();[config.sectionOrder[i],config.sectionOrder[j]]=[config.sectionOrder[j],config.sectionOrder[i]];changed();renderAll()}
function jump(k){activeArea='content';activeItem=k;renderAll()}function device(b,w){document.querySelectorAll('.devices button').forEach(x=>x.classList.remove('active'));b.classList.add('active');preview.style.width=w}
function editCategory(i){let c=config.categories[i],n=prompt('نام دسته‌بندی',c.name);if(n===null)return;push();c.name=n;let im=prompt('آدرس تصویر',c.image);if(im!==null)c.image=im;changed();renderAll()}
function editProduct(i){let x=config.products[i],n=prompt('نام محصول',x.name);if(n===null)return;push();x.name=n;let pr=prompt('قیمت فروش',x.price);if(pr!==null)x.price=+String(pr).replace(/,/g,'')||0;let op=prompt('قیمت قبلی (برای بدون تخفیف عدد ۰)',x.oldPrice||0);if(op!==null)x.oldPrice=+String(op).replace(/,/g,'')||0;let im=prompt('آدرس تصویر',x.image);if(im!==null)x.image=im;changed();renderAll()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:'application/json'}));a.download='store-settings.json';a.click()}
function resetAll(){if(confirm('همه تنظیمات به حالت اولیه برگردد؟')){StoreConfig.reset();config=StoreConfig.get();renderAll();preview.contentWindow.location.reload()}}
function toast(t){let e=document.createElement('div');e.className='toastx';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}renderAll();
</script></body></html>
