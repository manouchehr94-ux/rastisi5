<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برندها | فروشگاه</title><link rel="stylesheet" href="assets/storefront.css"><style>
.brands-hero{padding:70px 0 30px;text-align:center;background:linear-gradient(180deg,rgba(244,63,94,.07),transparent)}.brands-hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 12px}.brands-hero p{color:#697080;margin:0}.brands-search-wrap{max-width:680px;margin:28px auto 0;position:relative}.brands-search-wrap span{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:22px}.brands-search-wrap input{width:100%;height:58px;border:1px solid #e7e8eb;border-radius:18px;padding:0 52px 0 18px;font:inherit;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.06)}.brands-section{padding:28px 0 80px}.brand-alpha{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}.brand-alpha button{border:1px solid #e4e7ec;background:#fff;border-radius:10px;min-width:38px;height:38px;cursor:pointer;font-weight:700}.brand-alpha button.active{background:var(--primary,#e9386d);color:white;border-color:transparent}.customer-brand-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.customer-brand-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 12px;border:1px solid #eceef2;border-radius:18px;background:#fff;text-decoration:none;color:#151923;transition:.2s;min-height:180px}.customer-brand-card:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(15,23,42,.08)}.customer-brand-logo{width:92px;height:82px;display:grid;place-items:center;overflow:hidden;margin-bottom:13px}.customer-brand-logo img{width:100%;height:100%;object-fit:contain}.customer-brand-logo span{width:72px;height:72px;border-radius:20px;background:#f5f5f7;display:grid;place-items:center;font-size:24px;font-weight:900;color:#e9386d}.customer-brand-card strong{font-size:15px}.customer-brand-card small{direction:ltr;color:#8a909e;margin-top:4px}.customer-brand-card em{font-style:normal;color:#a1a6b0;font-size:11px;margin-top:10px}.brands-empty{text-align:center;grid-column:1/-1;padding:70px 20px;color:#777}@media(max-width:1050px){.customer-brand-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.customer-brand-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.customer-brand-grid{grid-template-columns:repeat(2,1fr);gap:10px}.customer-brand-card{min-height:150px;padding:15px 8px}.customer-brand-logo{width:72px;height:65px}}
</style></head><body>
<header class="header"><div class="container"><div class="head-main"><a class="logo" href="storefront.html"><span class="logo-mark">ن</span><span><strong>نوین‌شاپ</strong><small>فروشگاه آنلاین</small></span></a><div class="head-actions"><a class="btn btn-soft" href="storefront.html">بازگشت به فروشگاه</a></div></div><nav class="nav"><a href="storefront.html">خانه</a><a href="storefront.html#products">محصولات</a><a href="storefront-brands.html" style="font-weight:800">برندها</a><a href="storefront.html#footer">تماس با ما</a></nav></div></header>
<main><section class="brands-hero"><div class="container"><span class="eyebrow">برندهای فروشگاه</span><h1>برند دلخواهتان را پیدا کنید</h1><p>با نام فارسی یا انگلیسی جستجو کنید و محصولات همان برند را ببینید.</p><div class="brands-search-wrap"><span>⌕</span><input id="customerBrandSearch" placeholder="مثلاً لانکوم یا LANCOME"></div></div></section><section class="brands-section"><div class="container"><div class="brand-alpha" id="brandAlpha"></div><div class="customer-brand-grid" id="customerBrandGrid"></div></div></section></main>
<footer class="footer"><div class="container"><div class="copyright">© ۱۴۰۵ تمام حقوق فروشگاه محفوظ است.</div></div></footer>
<script>
(function(){const KEY='novinshop_brands_v1';const defaults=[{id:'b1',nameFa:'لانکوم',nameEn:'LANCOME',country:'فرانسه',logo:'',active:true,products:12},{id:'b2',nameFa:'ورساچه',nameEn:'VERSACE',country:'ایتالیا',logo:'',active:true,products:8},{id:'b3',nameFa:'شنل',nameEn:'CHANEL',country:'فرانسه',logo:'',active:true,products:15},{id:'b4',nameFa:'استی لادر',nameEn:'ESTEE LAUDER',country:'آمریکا',logo:'',active:true,products:6}];let brands;try{brands=JSON.parse(localStorage.getItem(KEY))||defaults}catch(e){brands=defaults}brands=brands.filter(b=>b.active);let letter='همه';const letters=['همه',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];const alpha=document.getElementById('brandAlpha');alpha.innerHTML=letters.map(x=>`<button class="${x==='همه'?'active':''}" data-letter="${x}">${x}</button>`).join('');alpha.onclick=e=>{if(!e.target.dataset.letter)return;letter=e.target.dataset.letter;alpha.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));render()};document.getElementById('customerBrandSearch').oninput=render;function esc(v){return String(v||'').replace(/[&<>\"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[s]))}function render(){const q=document.getElementById('customerBrandSearch').value.trim().toLowerCase();const list=brands.filter(b=>{const hit=(b.nameFa+' '+b.nameEn).toLowerCase().includes(q);const l=letter==='همه'||String(b.nameEn||'').toUpperCase().startsWith(letter);return hit&&l});document.getElementById('customerBrandGrid').innerHTML=list.length?list.map(b=>`<a class="customer-brand-card" href="storefront.html#products" title="محصولات ${esc(b.nameFa)}"><div class="customer-brand-logo">${b.logo?`<img src="${b.logo}" alt="${esc(b.nameFa)}">`:`<span>${esc((b.nameEn||b.nameFa).slice(0,2).toUpperCase())}</span>`}</div><strong>${esc(b.nameFa)}</strong><small>${esc(b.nameEn)}</small><em>${Number(b.products||0).toLocaleString('fa-IR')} محصول</em></a>`).join(''):'<div class="brands-empty"><h3>برندی پیدا نشد</h3><p>نام فارسی یا انگلیسی دیگری امتحان کنید.</p></div>'}render()})();
</script></body></html>
