  tenant_isolation_required: true
  shared_preview_public_renderer_required: true
  draft_preview_publish_rollback_required: true
  home_and_product_renderer_per_family_required: true
  desktop_and_mobile_required: true
  merchant_section_reorder_hide_duplicate_edit_required: true
