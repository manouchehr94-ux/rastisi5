{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطای سرور</title>
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="max-width:460px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:48px 32px">
    <div style="font-size:64px;margin-bottom:8px">⚠️</div>
    <div style="font-size:44px;font-weight:800;color:var(--violet);letter-spacing:2px">۵۰۰</div>
    <h1 style="font-size:18px;margin:10px 0 6px">خطایی در سرور رخ داد</h1>
    <p style="color:var(--muted);font-size:13.5px;margin-bottom:26px">
      مشکل موقتی است؛ لطفاً چند لحظه دیگر دوباره تلاش کنید.
    </p>
    <a href="/" style="display:inline-block;background:var(--violet);color:#fff;padding:11px 26px;border-radius:12px;font-size:13.5px;font-weight:700">بازگشت به صفحه اصلی</a>
  </div>
</div>
</body>
</html>
