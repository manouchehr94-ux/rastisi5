{% extends "base.html" %}

{% block title %}صفحه پیدا نشد | {{ SHOP_NAME }}{% endblock %}

{% block content %}
<div class="wrap" style="padding:70px 0;text-align:center">
  <div style="max-width:460px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:48px 32px">
    <div style="font-size:64px;margin-bottom:8px">🧭</div>
    <div style="font-size:44px;font-weight:800;color:var(--violet);letter-spacing:2px">۴۰۴</div>
    <h1 style="font-size:18px;margin:10px 0 6px">این صفحه پیدا نشد</h1>
    <p style="color:var(--muted);font-size:13.5px;margin-bottom:26px">
      ممکن است آدرس اشتباه باشد یا این صفحه جابه‌جا/حذف شده باشد.
    </p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a href="{% url 'catalog:home' %}" style="background:var(--violet);color:#fff;padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:700">بازگشت به صفحه اصلی</a>
      <a href="{% url 'catalog:product-list' %}" style="background:var(--violet-soft);color:var(--violet);padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:700">مشاهده‌ی کالاها</a>
    </div>
  </div>
</div>
{% endblock %}
