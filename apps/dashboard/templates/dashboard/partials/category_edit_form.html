<div class="modal-head">
  <h3>ویرایش «{{ category.name }}»</h3>
  <button type="button" class="x-btn" @click="modalOpen = false">✕</button>
</div>
<form hx-post="{% url 'dashboard:category-edit' category.pk %}" hx-target="#admin-modal-content" hx-swap="innerHTML">
  {% csrf_token %}
  <div class="modal-body">
    <div class="form-group">
      <label>نام</label>
      <input class="inp" name="name" value="{{ form.name.value|default_if_none:'' }}">
      {% for err in form.name.errors %}<div style="color:var(--red);font-size:11.5px;margin-top:4px">{{ err }}</div>{% endfor %}
    </div>
    <div class="form-group">
      <label>آیکون (ایموجی)</label>
      <input class="inp" name="icon" value="{{ form.icon.value|default_if_none:'' }}">
    </div>
  </div>
  <div class="modal-foot">
    <button type="submit" class="btn btn-primary">ذخیره</button>
    <button type="button" class="btn" @click="modalOpen = false">انصراف</button>
  </div>
</form>
