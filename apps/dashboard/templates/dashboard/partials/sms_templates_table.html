{% load persian %}
{% for row in sms_template_rows %}
  <div style="padding:13px 0;{% if not forloop.last %}border-bottom:1px solid var(--border){% endif %}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div>
        <b style="font-size:13px">{{ row.template.title }}</b>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">
          متغیرهای مجاز:
          {% for key, label in row.variables.items %}<code dir="ltr" style="background:var(--bg);padding:1px 5px;border-radius:5px;margin-inline-end:4px">{ {{ key }} }</code>{% endfor %}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
        <button type="button" class="btn btn-sm"
                hx-get="{% url 'dashboard:sms-template-edit' row.template.pk %}" hx-target="#admin-modal-content" hx-swap="innerHTML" @click="modalOpen = true">
          ✏️ ویرایش متن
        </button>
        <label class="switch">
          <input type="checkbox" {% if row.template.is_active %}checked{% endif %}
                 hx-post="{% url 'dashboard:sms-template-toggle' row.template.pk %}" hx-trigger="change" hx-swap="none">
          <span></span>
        </label>
      </div>
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:8px;white-space:pre-line">{{ row.template.body }}</p>
  </div>
{% empty %}
<p style="font-size:12.5px;color:var(--muted)">قالبی ثبت نشده است.</p>
{% endfor %}
