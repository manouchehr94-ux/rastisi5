<div class="modal-body">
  <h3 style="margin:0 0 12px">ویرایش تنظیمات — {{ definition.label_fa }}</h3>
  {% if field_errors.general %}<div class="field-error" style="margin-bottom:10px">{{ field_errors.general }}</div>{% endif %}
  <form method="post" action="{% url 'dashboard:storefront-builder-section-settings' section.pk %}" hx-boost="false">
    {% csrf_token %}
    {% if section.section_key == "image_text" %}
    <div class="form-group">
      <label for="id_title">عنوان</label>
      <input type="text" name="title" id="id_title" class="form-input" maxlength="200" value="{{ section.settings.title|default:'' }}">
    </div>
    <div class="form-group">
      <label for="id_image_url">آدرس تصویر (اختیاری)</label>
      <input type="url" name="image_url" id="id_image_url" class="form-input" dir="ltr" value="{{ section.settings.image_url|default:'' }}">
    </div>
    <div class="form-group">
      <label>موقعیت تصویر</label>
      <select name="image_position" class="form-select">
        <option value="right" {% if section.settings.image_position != "left" %}selected{% endif %}>راست</option>
        <option value="left" {% if section.settings.image_position == "left" %}selected{% endif %}>چپ</option>
      </select>
    </div>
    {% endif %}
    <div class="form-group">
      <label for="id_body_html">متن</label>
      <div x-data="richTextEditor()" x-init="mount()">
        <textarea class="inp" name="body_html" id="id_body_html" x-ref="source" style="min-height:160px">{{ section.settings.body_html|default:"" }}</textarea>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button type="submit" class="btn btn-primary">ذخیره تنظیمات</button>
      <button type="button" class="btn" @click="$dispatch('close-settings-modal')">انصراف</button>
    </div>
  </form>
</div>
