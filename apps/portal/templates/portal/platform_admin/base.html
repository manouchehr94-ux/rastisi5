{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}پنل مدیریت پلتفرم راستیسی{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'portal/css/platform-tokens.css' %}">
</head>
<body style="background:#0f1712;color:#e7f3ee">
{% csrf_token %}
<header style="border-bottom:1px solid #1e2b23;padding:16px 0">
  <div class="p-wrap" style="display:flex;align-items:center;justify-content:space-between">
    <strong>پنل مدیریت پلتفرم راستیسی</strong>
    {% if request.user.is_authenticated %}
    <form method="post" action="{% url 'portal_platform_admin:logout' %}">{% csrf_token %}<button type="submit" class="p-btn p-btn-ghost" style="color:#e7f3ee;border-color:#2a3a30">خروج</button></form>
    {% endif %}
  </div>
</header>
<main class="p-wrap" style="padding:32px 0">
{% block content %}{% endblock %}
</main>
</body>
</html>
