{% if turnstile_enabled %}
<div class="p-turnstile-wrap" style="margin:12px 0 16px;display:flex;justify-content:center">
  <div
    class="cf-turnstile"
    data-sitekey="{{ turnstile_site_key }}"
    data-action="{{ turnstile_action }}"
    data-theme="auto"
    data-language="fa"
    data-retry="auto"
    data-refresh-expired="auto"
  ></div>
</div>
<noscript>
  <div class="p-alert p-alert-warning" style="margin:12px 0">
    برای تأیید امنیتی، JavaScript مرورگر باید فعال باشد.
  </div>
</noscript>
{% endif %}
